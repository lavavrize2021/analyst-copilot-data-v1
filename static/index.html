<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analyst Copilot</title><style>
:root{--ink:#17231f;--muted:#66736d;--paper:#f4f1e9;--card:#fffdf7;--green:#174f3d;--line:#d8d4c8;--gold:#bd8b37}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;color:var(--ink);background:var(--paper)}header{padding:24px 6%;background:var(--green);color:white;display:flex;justify-content:space-between}h1{font:600 24px Georgia;margin:0}main{display:grid;grid-template-columns:290px 1fr;gap:22px;max-width:1200px;margin:28px auto;padding:0 20px}.panel,.chat{background:var(--card);border:1px solid var(--line);border-radius:12px}.panel{padding:18px;height:max-content}.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em}.upload{display:block;border:1px dashed var(--green);padding:14px;border-radius:8px;text-align:center;cursor:pointer}select,textarea,button{font:inherit;width:100%}select,textarea{border:1px solid var(--line);border-radius:7px;padding:10px;background:white}.status{font-size:13px;color:var(--muted);margin-top:10px}.chat{min-height:70vh;display:flex;flex-direction:column}.messages{padding:24px;flex:1;overflow:auto}.msg{max-width:82%;padding:13px 15px;border-radius:10px;margin-bottom:16px}.user{margin-left:auto;background:var(--green);color:white}.bot{background:#eeece4}.answer{font-size:17px}.cite{margin-top:12px;border-left:3px solid var(--gold);padding-left:12px;font-size:13px}.composer{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:1fr 110px;gap:10px}textarea{resize:none}button{background:var(--green);color:white;border:0;border-radius:7px;font-weight:600;cursor:pointer}.tag{font-size:12px;color:#d7e5df}@media(max-width:700px){main{grid-template-columns:1fr}.chat{min-height:60vh}}</style></head>
<body><header><h1>Analyst Copilot</h1><span class="tag">Evidence first · calibrated answers</span></header><main><aside class="panel"><h2>Add filing</h2><label class="upload">Choose HTML or text<input id="file" type="file" accept=".htm,.html,.txt,.md" hidden></label><div id="status" class="status">No upload in progress.</div><h2>Active filing</h2><select id="filings"><option value="">Choose a filing</option></select></aside><section class="chat"><div id="messages" class="messages"><div class="msg bot">Upload or choose a filing, then ask a precise financial question. Supported answers include a page and verbatim evidence.</div></div><div class="composer"><textarea id="q" rows="2" placeholder="What was FY2022 capital expenditure?"></textarea><button id="ask">Ask</button></div></section></main><script>
const $=s=>document.querySelector(s),messages=$('#messages');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){let x=await fetch('/api/filings').then(r=>r.json()),old=$('#filings').value;$('#filings').innerHTML='<option value="">Choose a filing</option>'+x.filings.map(f=>`<option value="${f.id}">${esc(f.name)} · ${f.pages} pages</option>`).join('');$('#filings').value=old}load();$('#file').onchange=async e=>{let fd=new FormData;fd.append('file',e.target.files[0]);let x=await fetch('/api/upload',{method:'POST',body:fd}).then(r=>r.json());if(x.error)return $('#status').textContent=x.error;let timer=setInterval(async()=>{let s=await fetch('/api/status/'+x.job_id).then(r=>r.json());$('#status').textContent=`${s.status} · ${s.progress||0}%`;if(s.status==='ready'||s.status==='error'){clearInterval(timer);await load();if(s.filing_id)$('#filings').value=s.filing_id}},700)};async function ask(){let q=$('#q').value.trim(),fid=$('#filings').value;if(!q||!fid)return;messages.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div><div class="msg bot" id="pending">Checking the filing…</div>`);$('#q').value='';let x=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,filing_id:fid})}).then(r=>r.json());$('#pending').remove();let ev=(x.evidence||[]).map(e=>`<div class="cite"><b>${esc(x.document)}, page ${e.page}</b><br>${esc(e.quote)}</div>`).join('');messages.insertAdjacentHTML('beforeend',`<div class="msg bot"><div class="answer">${esc(x.answer||x.error)}</div>${ev}${x.note?`<div class="status">${esc(x.note)}</div>`:''}</div>`);messages.scrollTop=messages.scrollHeight}$('#ask').onclick=ask;$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
</script></body></html>
